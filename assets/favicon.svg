<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Hydra Steam Foam">
  <!-- Favicon: the badge reduced to the three things that still read at 16px —
       the navy plate with its gold ring, the Burj Khalifa's needle over a
       skyline, and the cream sofa. The full mark in assets/logo.svg turns to
       mush at this size. -->
  <defs>
    <linearGradient id="fav-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16407e"/>
      <stop offset="1" stop-color="#06152f"/>
    </linearGradient>
    <clipPath id="fav-clip"><circle cx="32" cy="32" r="31"/></clipPath>
  </defs>

  <circle cx="32" cy="32" r="31" fill="url(#fav-plate)"/>

  <g clip-path="url(#fav-clip)">
    <g fill="#d9b545">
      <path d="M9,36 C9,25 12,17 19,11 L19,36 Z"/>
      <path d="M23,36 L23,24 L28,24 L28,36 Z"/>
      <path d="M31,36 L31,19 L33,19 L33,12 L34.4,12 L35,3 L35.6,12 L37,12 L37,19 L39,19 L39,36 Z"/>
      <path d="M42,36 L42,21 L47,21 L47,36 Z"/>
      <path d="M50,36 L50,27 L55,27 L55,36 Z"/>
    </g>
    <!-- Sofa -->
    <rect x="12" y="39" width="40" height="12" rx="4" fill="#f4ead6"/>
    <rect x="7" y="44" width="50" height="13" rx="4" fill="#f4ead6"/>
    <rect x="7" y="41" width="9" height="16" rx="4" fill="#f4ead6"/>
    <rect x="48" y="41" width="9" height="16" rx="4" fill="#f4ead6"/>
    <rect x="17" y="41" width="9" height="9" rx="2" fill="#16407e"/>
    <rect x="28" y="41" width="9" height="9" rx="2" fill="#16407e"/>
    <rect x="39" y="41" width="8" height="9" rx="2" fill="#16407e"/>
  </g>

  <circle cx="32" cy="32" r="29.6" fill="none" stroke="#d9b545" stroke-width="2.4"/>
</svg>
